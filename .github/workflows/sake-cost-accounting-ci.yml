name: Sake cost accounting CI

on:
  pull_request:
    paths:
      - "sake-cost-accounting-src/**"
      - ".github/workflows/sake-cost-accounting-ci.yml"
  push:
    branches:
      - main
    paths:
      - "sake-cost-accounting-src/**"
      - ".github/workflows/sake-cost-accounting-ci.yml"

permissions:
  contents: read

jobs:
  verify-sake-cost-accounting:
    name: Lint, tests, build and Chromium E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sake-cost-accounting-src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sake-cost-accounting-src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit and component tests
        run: npm test
      - name: Build Pages assets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e -- --reporter=dot
